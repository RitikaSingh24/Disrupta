# alembic.ini
# Alembic configuration for IROP Passenger Rebooking Copilot.
# The DATABASE_URL is read from the environment via env.py —
# do NOT hardcode credentials here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Logging — keep it clean
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
